projects:
  - id: deep-dive
    title: Deep Dive
    kicker: AI career assessment platform · MBA thesis
    period: 2025 – 2026
    summary: My MBA thesis, finished and live. A career assessment with 147 questions and 30 career archetypes I designed myself, plus an AI coach that gives advice based on your own results. I built it alone, from the questionnaire and scoring model to the production code.
    featured: true
    metrics:
      - value: "147"
        label: assessment questions
      - value: "30"
        label: original archetypes
      - value: "5"
        label: layer scoring pipeline
      - value: 76k+
        label: lines of code, solo
    stack:
      - Next.js
      - TypeScript
      - PostgreSQL
      - Claude API
      - Vercel
    links:
      - label: Visit deepdivecareer.com
        href: https://www.deepdivecareer.com
    caseStudy:
      problem: I have taken a lot of career tests myself. Most of them give you a label and stop there. As someone who moved from China to the Netherlands, I also noticed they never ask about the cross-cultural side of who you are, which for me was the biggest factor in every career decision. I wanted to build something that goes further and helps you decide what to do next.
      approach:
        - Designed a multi-dimensional assessment framework (147 questions) covering personality, vocational interests, cognitive style and cross-cultural identity.
        - Combined established instruments (Holland RIASEC, Big Five, Career Anchors, CliftonStrengths, MBTI Step II, DISC, HBDI) with my own research into 30 bilingual career archetypes.
        - Built a 5-layer scoring pipeline that turns raw answers into a career profile, with written rules so scoring stays consistent.
        - Added an AI coach that works from each person’s own results instead of giving generic advice.
      outcome:
        - A live, full-stack product at deepdivecareer.com, built with Next.js, TypeScript and PostgreSQL (76,000+ lines of code).
        - Submitted as my thesis for the MBA in AI, Data & Analytics at the University of Amsterdam.
        - Bilingual (English and Chinese) from day one.
        - What it taught me about delivery (scope, testing with real users, fixing what breaks) I now bring to every project.
