intro:
  - I grew up in China and came to the Netherlands in 2015 to do a master’s in Dutch linguistics at Leiden. The plan was to stay for two years. It has been nine, and this is home now.
  - Since then I have worked at Huawei, Amazon, Philips and Tencent. The jobs looked different on paper, but the work I liked most was always the same kind. At Amazon I helped more than ten vendors grow and helped get the Dutch marketplace ready for launch. At Philips I worked with Amazon Ads and AWS to ship new features our media teams needed. At Tencent I was the IT contact for three game studios and made sure the tools they asked for were actually delivered and used.
  - What I have learned is that I do my best work close to something real. A customer who needs to be up and running. A supplier who has to deliver on time. A product that has to work on Monday morning. That is where being Chinese, speaking Dutch and working in English every day helps the most, because trust between partners from different cultures is built in person, one problem at a time.
  - I also like building things myself. In 2024 I started an MBA in AI, Data and Analytics at the University of Amsterdam, and for my thesis I built Deep Dive, a career assessment platform, from the questionnaire to the code. I use AI every day, but mostly to take the boring parts out of my work, so I have more time for the parts that need a person.
  - I have changed jobs more often than I would like. For the next one I want to go deep, stay for years, and get better at one field instead of starting over. High-tech hardware around Eindhoven is where I would most like that to be. If you work there and think I could help, I would be glad to talk.
