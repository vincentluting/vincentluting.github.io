intro:
  - I grew up in China and came to the Netherlands in 2015 to do a master’s in Dutch linguistics at Leiden. The plan was to stay for two years. I have worked here since 2018, and this is home now.
  - "Since then I have worked at four very different companies. The jobs looked different on paper, but the work I liked most was always the same kind: sitting between two groups of people who need each other, and making sure the thing they agreed on actually happens."
  - What I have learned is that I do my best work close to something real. A customer who needs to be up and running. A supplier who has to deliver on time. A product that has to work on Monday morning. Being Chinese, speaking Dutch and working in English every day helps there, because trust between people from different cultures is built in person, one problem at a time.
  - I also like building things myself. In 2024 I started an MBA in AI, Data and Analytics at the University of Amsterdam, and for my thesis I built Deep Dive, a career assessment platform, from the questionnaire to the code. I use AI every day, but mostly to take the boring parts out of my work, so I have more time for the parts that need a person.
  - I have changed jobs more often than I would like. Next I want to go deep, stay for years, and get better at one thing instead of starting over.
