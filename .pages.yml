# Pages CMS configuration (https://pagescms.org)
# Sign in at https://app.pagescms.org with GitHub, open this repository, and edit
# everything below through forms. Every save is a commit to `main`, which
# rebuilds and publishes the site automatically (about 1 minute).

media:
  - name: images
    label: Images
    input: src/assets/uploads
    output: /src/assets/uploads
    categories: [image]
    rename: safe
  - name: files
    label: Files (CV)
    input: public/cv
    output: /cv
    extensions: [pdf]
    rename: safe

components:
  bullets:
    name: bullets
    label: Bullet points
    type: string
    list: true
    description: 一条一句，动词开头，尽量带数字。

content:
  - name: site
    label: Profile & contact
    type: file
    path: src/data/site.yaml
    format: yaml
    fields:
      - { name: name, label: Name, type: string, required: true }
      - { name: preferredName, label: Preferred name, type: string }
      - { name: fullName, label: Full display name, type: string, description: 用于浏览器标题和页脚，例如 "Ting (Vincent) Lu" }
      - { name: role, label: Job title, type: string, description: 页脚和搜索引擎里显示的职位 }
      - { name: tagline, label: Hero eyebrow line, type: string, description: 首页标题上方的小字 }
      - { name: headline, label: Hero headline, type: text, description: 首页 "Hi, I'm Vincent." 下面的一句话 }
      - { name: lead, label: Hero paragraph (not shown now), type: text, description: 改版后首页不再显示这一段，保留备用 }
      - { name: location, label: Location, type: string }
      - { name: availability, label: Availability line, type: string, description: 例如 "Open to new roles"，留空则隐藏 }
      - { name: workAuthorization, label: Work authorisation line, type: string, description: 例如 "Permanent resident, no visa sponsorship needed"，留空则隐藏 }
      - name: lookingFor
        label: What I am looking for (home page)
        type: object
        fields:
          - { name: intro, label: Intro sentence, type: text }
          - { name: roles, label: Roles, type: string, list: true }
          - { name: sectors, label: Sectors, type: string, list: true }
          - { name: region, label: Region, type: string }
      - { name: email, label: Email, type: string }
      - { name: linkedin, label: LinkedIn URL, type: string }
      - { name: deepDive, label: Deep Dive URL, type: string }
      - name: portrait
        label: Portrait photo
        type: image
        options: { media: images }
        description: 首页和 About 页的照片，建议竖版 4:5
      - name: cvPath
        label: CV PDF
        type: file
        options: { media: files }
        description: 上传新的 PDF 后在这里选中它。文件不存在时网站会自动隐藏下载按钮。
      - { name: url, label: Site URL, type: string, readonly: true }
      - { name: description, label: SEO description, type: text, description: 搜索引擎和分享预览里的一段介绍 }
      - name: languages
        label: Languages
        type: object
        list: true
        fields:
          - { name: name, label: Language, type: string }
          - { name: level, label: Level, type: string }
      - { name: companies, label: Companies, type: string, list: true, description: "首页 10 秒速览里的 Companies 一行（名字里带 University 的会自动跳过）" }

  - name: about
    label: About page
    type: file
    path: src/data/about.yaml
    format: yaml
    fields:
      - { name: intro, label: Story paragraphs, type: text, list: true, description: 每一项是一段 }
      - { name: hobbies, label: Outside work, type: string, list: true }

  - name: experience
    label: Experience
    type: file
    path: src/data/experience.yaml
    format: yaml
    fields:
      - name: jobs
        label: Jobs
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{fields.company} · {fields.role}"
        fields:
          - { name: id, label: ID, type: string, description: 小写字母和连字符，例如 tencent-esports, pattern: "^[a-z0-9-]+$" }
          - { name: company, label: Company, type: string, required: true }
          - { name: role, label: Role, type: string, required: true }
          - { name: location, label: Location, type: string }
          - { name: start, label: Start, type: string, description: 例如 "May 2025" }
          - { name: end, label: End, type: string, description: 例如 "Jun 2026" 或 "Present" }
          - { name: summary, label: One-line summary, type: text }
          - { name: bullets, component: bullets }
          - { name: featured, label: Featured (not used now), type: boolean, description: 改版后首页不再列出工作经历，保留备用 }
          - { name: highlightIdx, label: Highlighted bullets (not used now), type: number, list: true, description: 改版后未使用，保留备用 }
          - { name: tags, label: Tags, type: string, list: true }
      - name: education
        label: Education
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{fields.school}"
        fields:
          - { name: school, label: School, type: string, required: true }
          - { name: degree, label: Degree, type: string }
          - { name: field, label: Field of study, type: string }
          - { name: location, label: Location, type: string }
          - { name: years, label: Years, type: string }
          - { name: note, label: Note, type: string }
      - name: certifications
        label: Certifications
        type: object
        list: true
        fields:
          - { name: name, label: Name, type: string, required: true }
          - { name: issuer, label: Issuer, type: string }
          - { name: year, label: Year, type: string }

  - name: skills
    label: Skills & numbers
    type: file
    path: src/data/skills.yaml
    format: yaml
    fields:
      - name: groups
        label: Skill groups
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{fields.title}"
        fields:
          - { name: title, label: Group title, type: string }
          - { name: items, label: Items, type: string, list: true }
      - name: highlights
        label: Key numbers (Experience page)
        type: object
        list:
          collapsible:
            summary: "{fields.value} {fields.label}"
        fields:
          - { name: value, label: Number, type: string, description: 例如 "8+" }
          - { name: label, label: Label, type: string }
          - { name: sub, label: Small print, type: string }

  - name: stories
    label: Stories (work case studies)
    type: collection
    path: src/content/stories
    filename: "{primary}.md"
    view:
      primary: title
      sort: order
      order: asc
      fields: [title, company, order, draft]
    fields:
      - { name: title, label: Title, type: string, required: true, description: 标题直接写结果，例如 "Cutting ticket resolution from 18 days to 8" }
      - { name: summary, label: Summary, type: text, required: true, description: 卡片和页面顶部的两三句话，忙的人只看这一段 }
      - { name: company, label: Company, type: string, required: true }
      - { name: role, label: My role / title, type: string, required: true }
      - { name: period, label: Period, type: string, description: 例如 "2019 – 2021" }
      - { name: order, label: Order, type: number, description: 数字越小越靠前，首页显示前 4 个 }
      - { name: draft, label: Draft (hide from site), type: boolean, default: false }
      - { name: job, label: Matching job ID, type: string, description: "对应 Experience 里的 ID（例如 amazon），经历页会出现 “Read the full story” 链接" }
      - name: tldr
        label: In short (TL;DR box)
        type: object
        fields:
          - { name: context, label: The situation, type: text, required: true }
          - { name: myRole, label: What I owned, type: text, required: true }
          - { name: team, label: Team, type: text }
          - { name: stakeholders, label: Worked with, type: text }
          - name: numbers
            label: Key numbers
            type: object
            list: true
            description: 第一个数字会被手绘红圈圈出，也会显示在首页卡片上。最多 3 个。
            fields:
              - { name: value, label: Number, type: string, description: 例如 "18 → 8" 或 "$91k" }
              - { name: label, label: What it means, type: string }
          - { name: skills, label: Skills shown, type: string, list: true }
      - name: links
        label: Links
        type: object
        list: true
        fields:
          - { name: label, label: Label, type: string }
          - { name: href, label: URL, type: string }
      - name: body
        label: Story
        type: rich-text
        description: "建议小标题：The situation / The hard part / What I did / What came out of it / What I would do differently"
        options: { format: markdown, media: images, path: stories }

  - name: how-i-work
    label: How I work page
    type: file
    path: src/content/pages/how-i-work.md
    format: yaml-frontmatter
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: description, label: SEO description, type: text }
      - name: updated
        label: Last updated
        type: date
        options: { format: "yyyy-MM-dd" }
      - name: body
        label: Page text
        type: rich-text
        options: { format: markdown }

  - name: now
    label: Now page
    type: file
    path: src/data/now.yaml
    format: yaml
    fields:
      - name: updated
        label: Last updated
        type: date
        options: { format: "yyyy-MM-dd" }
        description: 每次修改时更新日期
      - { name: intro, label: Intro, type: text }
      - name: sections
        label: Sections
        type: object
        list:
          collapsible:
            summary: "{fields.title}"
        description: 前 3 个分区的第一条会显示在首页的 Now 卡片里
        fields:
          - { name: title, label: Section title, type: string }
          - { name: items, label: Items, type: text, list: true }

  - name: testimonials
    label: Testimonials
    type: file
    path: src/data/testimonials.yaml
    format: yaml
    fields:
      - name: items
        label: Quotes
        type: object
        list:
          collapsible:
            summary: "{fields.name}"
        description: 同事或客户的一两句推荐（可以从 LinkedIn 推荐里摘）。至少有一条时首页才会显示这一块。
        fields:
          - { name: quote, label: Quote, type: text, required: true }
          - { name: name, label: Name, type: string, required: true }
          - { name: title, label: Their job title, type: string, required: true }
          - { name: company, label: Company, type: string }
          - { name: relation, label: How we worked together, type: string, description: 例如 "My manager at Tencent, 2023–2025" }
          - { name: link, label: LinkedIn URL, type: string }

  - name: posts
    label: Writing
    type: collection
    path: src/content/posts
    filename: "{primary}.md"
    view:
      primary: title
      sort: date
      order: desc
      fields: [title, date, draft]
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: description, label: Description, type: text, description: 列表卡片和分享预览里显示的一两句话 }
      - name: date
        label: Date
        type: date
        options: { format: "yyyy-MM-dd" }
      - { name: tags, label: Tags, type: string, list: true }
      - { name: draft, label: Draft (hide from site), type: boolean, default: false }
      - name: cover
        label: Cover image
        type: image
        options: { media: images, path: posts }
      - { name: coverAlt, label: Cover image description, type: string }
      - name: body
        label: Body
        type: rich-text
        options: { format: markdown, media: images, path: posts }
