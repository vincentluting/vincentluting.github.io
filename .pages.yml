# Pages CMS configuration (https://pagescms.org)
# Sign in at https://app.pagescms.org with GitHub, open this repository, and edit
# everything below through forms. Every save is a commit to `main`, which
# rebuilds and publishes the site automatically (about 1 minute).

media:
  - name: images
    label: Images
    input: src/assets/uploads
    output: /src/assets/uploads
    categories: [image]
    rename: safe
  - name: files
    label: Files (CV)
    input: public/cv
    output: /cv
    extensions: [pdf]
    rename: safe

content:
  - name: site
    label: Profile & contact
    type: file
    path: src/data/site.yaml
    format: yaml
    fields:
      - { name: name, label: Name, type: string, required: true }
      - { name: preferredName, label: Preferred name, type: string }
      - { name: fullName, label: Full display name, type: string, description: 用于浏览器标题和页脚，例如 "Ting (Vincent) Lu" }
      - { name: role, label: Job title, type: string, description: 只用于搜索引擎（结构化数据），页面上不显示 }
      - { name: tagline, label: Hero eyebrow line, type: string, description: 首页标题上方的小字，例如 "Utrecht, the Netherlands" }
      - { name: headline, label: Hero text, type: text, description: 首页 "Hi, I'm Ting." 下面的一段自我介绍 }
      - { name: location, label: Location, type: string }
      - { name: email, label: Email, type: string }
      - { name: linkedin, label: LinkedIn URL, type: string }
      - { name: deepDive, label: Deep Dive URL, type: string }
      - name: portrait
        label: Portrait photo
        type: image
        options: { media: images }
        description: 首页和 About 页的照片，建议竖版 4:5
      - name: cvPath
        label: CV PDF
        type: file
        options: { media: files }
        description: 现在留空，网站不提供简历下载。以后如果想要，上传 PDF 后在这里选中它。
      - { name: url, label: Site URL, type: string, readonly: true }
      - { name: description, label: SEO description, type: text, description: 搜索引擎里的一段介绍，最好不超过 160 个字符 }
      - { name: googleSiteVerification, label: Google Search Console code, type: string, description: '只填 content="…" 里的那串字符，留空则不输出' }
      - name: languages
        label: Languages
        type: object
        list: true
        fields:
          - { name: name, label: Language, type: string }
          - { name: level, label: Level, type: string, description: About 页显示的完整说明 }

  - name: about
    label: About page
    type: file
    path: src/data/about.yaml
    format: yaml
    fields:
      - { name: intro, label: Story paragraphs, type: text, list: true, description: 每一项是一段 }
      - { name: hobbies, label: Outside work, type: string, list: true }

  - name: stories
    label: Stories (work case studies)
    type: collection
    path: src/content/stories
    filename: "{primary}.md"
    view:
      primary: title
      sort: order
      order: asc
      fields: [title, company, order, draft]
    fields:
      - { name: title, label: Title, type: string, required: true, description: 像讲故事一样的标题，例如 "Why vendors on Amazon waited so long for an answer" }
      - { name: shortTitle, label: Short title for Google and the browser tab, type: string, description: '最多约 45 个字符，例如 "Amazon vendor tickets: 18 days to 8"' }
      - { name: summary, label: Summary, type: text, required: true, description: 卡片和页面顶部的两三句话，忙的人只看这一段 }
      - { name: company, label: Company, type: string, required: true }
      - { name: role, label: My role / title, type: string, required: true }
      - { name: period, label: Period, type: string, description: 例如 "2019 – 2021" }
      - { name: order, label: Order, type: number, description: 数字越小越靠前 }
      - { name: draft, label: Draft (hide from site), type: boolean, default: false }
      - name: tldr
        label: In short (not shown on the site now)
        type: object
        fields:
          - { name: context, label: The situation, type: text, required: true }
          - { name: myRole, label: What I owned, type: text, required: true }
          - { name: team, label: Team, type: text }
          - { name: stakeholders, label: Worked with, type: text }
          - name: numbers
            label: Key numbers
            type: object
            list: true
            description: 目前网站不显示这部分，保留作为你自己的笔记。
            fields:
              - { name: value, label: Number, type: string, description: 例如 "18 → 8" 或 "$91k" }
              - { name: label, label: What it means, type: string }
              - { name: how, label: How measured, type: string, description: '基线、时间段、数据来源、你自己的份额，例如 "Q1 vs Q4 2020, team dashboard, my proposal"' }
          - { name: skills, label: Skills shown, type: string, list: true }
      - name: links
        label: Links
        type: object
        list: true
        fields:
          - { name: label, label: Label, type: string }
          - { name: href, label: URL, type: string }
      - name: body
        label: Story
        type: rich-text
        description: "建议小标题：The situation / The hard part / What I did / What came out of it /（可选）What I learned"
        options: { format: markdown, media: images, path: stories }

  - name: how-i-work
    label: How I run a project page
    type: file
    path: src/content/pages/how-i-work.md
    format: yaml-frontmatter
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: description, label: SEO description, type: text }
      - name: updated
        label: Last updated
        type: date
        options: { format: "yyyy-MM-dd" }
      - name: body
        label: Page text
        type: rich-text
        options: { format: markdown }

  - name: now
    label: Now page
    type: file
    path: src/data/now.yaml
    format: yaml
    fields:
      - name: updated
        label: Last updated
        type: date
        options: { format: "yyyy-MM-dd" }
        description: 每次修改时更新日期
      - { name: intro, label: Intro, type: text }
      - name: sections
        label: Sections
        type: object
        list:
          collapsible:
            summary: "{fields.title}"
        description: 前 3 个分区的第一条会显示在首页的 Now 卡片里
        fields:
          - { name: title, label: Section title, type: string }
          - { name: items, label: Items, type: text, list: true }

  - name: testimonials
    label: Testimonials
    type: file
    path: src/data/testimonials.yaml
    format: yaml
    fields:
      - name: items
        label: Quotes
        type: object
        list:
          collapsible:
            summary: "{fields.name}"
        description: 同事或客户的一两句推荐（可以从 LinkedIn 推荐里摘）。至少有一条时首页才会显示这一块。
        fields:
          - { name: quote, label: Quote, type: text, required: true }
          - { name: name, label: Name, type: string, required: true }
          - { name: title, label: Their job title, type: string, required: true }
          - { name: company, label: Company, type: string }
          - { name: relation, label: How we worked together, type: string, description: 例如 "My manager at Tencent, 2023–2025" }
          - { name: link, label: LinkedIn URL, type: string }

  - name: posts
    label: Writing
    type: collection
    path: src/content/posts
    filename: "{primary}.md"
    view:
      primary: title
      sort: date
      order: desc
      fields: [title, date, draft]
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: description, label: Description, type: text, description: 列表卡片和分享预览里显示的一两句话 }
      - name: date
        label: Date
        type: date
        options: { format: "yyyy-MM-dd" }
      - { name: tags, label: Tags, type: string, list: true }
      - { name: draft, label: Draft (hide from site), type: boolean, default: false }
      - { name: note, label: Note at the top, type: string, description: '例如 "Written in 2024, in the first months of my MBA."' }
      - name: cover
        label: Cover image
        type: image
        options: { media: images, path: posts }
      - { name: coverAlt, label: Cover image description, type: string }
      - name: body
        label: Body
        type: rich-text
        options: { format: markdown, media: images, path: posts }
